services:
  db:
    image: postgres:16-alpine
    container_name: diary-redmine-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: redmine
      POSTGRES_USER: redmine
      POSTGRES_PASSWORD: redmine-test-password
    volumes:
      - redmine-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U redmine -d redmine"]
      interval: 5s
      timeout: 5s
      retries: 12

  redmine:
    image: redmine:5
    container_name: diary-redmine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      REDMINE_DB_POSTGRES: db
      REDMINE_DB_PORT: 5432
      REDMINE_DB_DATABASE: redmine
      REDMINE_DB_USERNAME: redmine
      REDMINE_DB_PASSWORD: redmine-test-password
    volumes:
      - redmine-files:/usr/src/redmine/files

volumes:
  redmine-db:
  redmine-files:
