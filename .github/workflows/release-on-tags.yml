name: Create releases on tag push
on:
  push:
    tags:
      - 'v*'
permissions: 
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix: 
        rid: [win-x64, linux-x64]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: '0'

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore packages
        run: dotnet restore Diary.App/Diary.App.csproj

      - name: Publish for ${{ matrix.rid }}
        run: |
          RID=${{ matrix.rid }}
          OUT=publish/${RID}
          mkdir -p ${OUT}
          dotnet publish -c Release -r $RID --self-contained true --no-restore -o $OUT Diary.App/Diary.App.csproj
          ARCHIVE=DiaryAppNG-${{ github.ref_name }}-${RID}.zip
          cd ${OUT}
          find runtimes -maxdepth 2 -mindepth 2 \( -not -path '*${RID}*' \) -exec rm -rf {} +
          zip -r ../../$ARCHIVE .
          cd ../..
          ls -lh $ARCHIVE

      - name: Upload artifact for ${{ matrix.rid }}
        uses: actions/upload-artifact@v4
        with:
          name: DiaryAppNG-${{ github.ref_name }}-${{ matrix.rid }}
          path: DiaryAppNG-${{ github.ref_name }}-${{ matrix.rid }}.zip

  create-releases:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: '0'

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Extract release notes from CHANGELOG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v version="$VERSION" '
            $0 ~ "^## " version " " { found=1; print; next }
            found && $0 ~ /^## / { exit }
            found { print }
          ' Docs/CHANGELOG.md > release-body.md
          if [ ! -s release-body.md ]; then
            echo "Automated release created by CI for ${GITHUB_REF_NAME}." > release-body.md
          fi

      - name: Create github release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release-body.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: artifacts/**/*.zip
