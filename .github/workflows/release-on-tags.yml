name: Create releases on tag push

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Restore packages
        run: dotnet restore DiaryApp.sln
      - name: Release build
        run: dotnet build DiaryApp.sln --configuration Release --no-restore
      - name: Run all tests
        run: dotnet test DiaryApp.sln --configuration Release --no-build --no-restore --verbosity minimal
        env:
          DIARY_REQUIRE_POSTGRES_TESTS: ${{ runner.os == 'Linux' && '1' || '0' }}
          DIARY_REQUIRE_PYTHON_TESTS: '1'

  build:
    name: Publish ${{ matrix.rid }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore solution for ${{ matrix.rid }}
        run: dotnet restore DiaryApp.sln --runtime ${{ matrix.rid }}
      - name: Publish and package ${{ matrix.rid }}
        shell: pwsh
        run: |
          $rid = '${{ matrix.rid }}'
          $out = Join-Path 'publish' $rid
          $archive = 'DiaryAppNG-${{ github.ref_name }}-' + $rid + '.zip'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          dotnet publish Diary.App/Diary.App.csproj --configuration Release --runtime $rid --self-contained true --no-restore --output $out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $workerExecutable = if ($rid -eq 'win-x64') { 'Diary.Script.Worker.exe' } else { 'Diary.Script.Worker' }
          $requiredFiles = @(
            'Diary.App.dll',
            'Diary.Script.Worker.dll',
            $workerExecutable,
            'Diary.Script.Worker.deps.json',
            'Diary.Script.Worker.runtimeconfig.json',
            'Microsoft.Diagnostics.NETCore.Client.dll',
            'Diary.RedMine.dll',
            'Diary.RedMine.UI.dll',
            'Diary.RedMine.SQLite.dll',
            'Diary.RedMine.PostgreSQL.dll',
            'Diary.Jira.dll',
            'Diary.Jira.UI.dll',
            'Diary.Jira.SQLite.dll',
            'Diary.Jira.PostgreSQL.dll'
          )
          foreach ($requiredFile in $requiredFiles) {
            $requiredPath = Join-Path $out $requiredFile
            if (-not (Test-Path -LiteralPath $requiredPath)) {
              throw "Publish output is missing required file: $requiredFile"
            }
          }
          if ($rid -eq 'linux-x64') {
            Push-Location $out
            & zip -r (Join-Path $env:GITHUB_WORKSPACE $archive) .
            $zipExitCode = $LASTEXITCODE
            Pop-Location
            if ($zipExitCode -ne 0) { exit $zipExitCode }
          } else {
            Compress-Archive -Path (Join-Path $out '*') -DestinationPath $archive -CompressionLevel Optimal

            $pythonVersion = '3.13.15'
            $pythonArchive = Join-Path $env:RUNNER_TEMP "python-$pythonVersion-embed-amd64.zip"
            $pythonUri = "https://www.python.org/ftp/python/$pythonVersion/python-$pythonVersion-embed-amd64.zip"
            $pythonSha256 = 'd1f04d990aee1253d8569e8e5104e30fa9f5fa830899f14843448872d936a2cf'
            Invoke-WebRequest -Uri $pythonUri -OutFile $pythonArchive
            $actualSha256 = (Get-FileHash -LiteralPath $pythonArchive -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualSha256 -ne $pythonSha256) {
              throw "Python embedded package checksum mismatch: expected $pythonSha256, got $actualSha256"
            }

            $pythonDirectory = Join-Path $out 'python'
            Expand-Archive -LiteralPath $pythonArchive -DestinationPath $pythonDirectory -Force
            $bundledPython = Join-Path $pythonDirectory 'python.exe'
            if (-not (Test-Path -LiteralPath $bundledPython)) {
              throw 'Python embedded package is missing python/python.exe'
            }
            $pythonVersionOutput = & $bundledPython --version 2>&1 | Out-String
            if ($LASTEXITCODE -ne 0 -or $pythonVersionOutput -notmatch 'Python 3\.13\.') {
              throw "Unexpected bundled Python version: $pythonVersionOutput"
            }

            $bundledArchive = 'DiaryAppNG-${{ github.ref_name }}-' + $rid + '-python313.zip'
            Compress-Archive -Path (Join-Path $out '*') -DestinationPath $bundledArchive -CompressionLevel Optimal
          }
          Get-Item $archive | Format-List Name, Length
          if ($rid -eq 'win-x64') {
            Get-Item $bundledArchive | Format-List Name, Length
          }
      - name: Upload artifact for ${{ matrix.rid }}
        uses: actions/upload-artifact@v4
        with:
          name: DiaryAppNG-${{ github.ref_name }}-${{ matrix.rid }}
          path: DiaryAppNG-${{ github.ref_name }}-${{ matrix.rid }}*.zip
          if-no-files-found: error

  create-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Extract release notes from CHANGELOG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BASE_VERSION=$(echo "$VERSION" | sed -E 's/-[a-zA-Z][a-zA-Z0-9.]*$//')
          for candidate in "$VERSION" "$BASE_VERSION"; do
            awk -v version="$candidate" '
              $0 ~ "^## " version " " { found=1; print; next }
              found && $0 ~ /^## / { exit }
              found { print }
            ' Docs/CHANGELOG.md > release-body.md
            [ -s release-body.md ] && break
          done
          if [ ! -s release-body.md ]; then
            echo "Automated release created by CI for ${GITHUB_REF_NAME}." > release-body.md
          fi
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release-body.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: artifacts/**/*.zip
