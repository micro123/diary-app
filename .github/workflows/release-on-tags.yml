name: Create releases on tag push

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Restore packages
        run: dotnet restore DiaryApp.sln
      - name: Release build
        run: dotnet build DiaryApp.sln --configuration Release --no-restore
      - name: Run all tests
        run: dotnet test --solution DiaryApp.sln --configuration Release --no-build --no-restore --verbosity minimal
        env:
          DIARY_REQUIRE_POSTGRES_TESTS: ${{ runner.os == 'Linux' && '1' || '0' }}
          DIARY_REQUIRE_PYTHON_TESTS: '1'

  build:
    name: Publish ${{ matrix.rid }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Restore solution for ${{ matrix.rid }}
        run: dotnet restore DiaryApp.sln --runtime ${{ matrix.rid }}
      - name: Cache Python embeddable runtime
        if: matrix.rid == 'win-x64'
        uses: actions/cache@v5
        with:
          path: .cache/python
          key: diaryapp-python-3.13.15-d1f04d990aee1253d8569e8e5104e30fa9f5fa830899f14843448872d936a2cf
      - name: Publish and package ${{ matrix.rid }}
        shell: pwsh
        run: |
          $rid = '${{ matrix.rid }}'
          $out = Join-Path 'publish' $rid
          $archive = 'DiaryAppNG-${{ github.ref_name }}-' + $rid + '.zip'
          $debugOut = Join-Path 'publish' "$rid-dbg"
          $debugArchive = 'DiaryAppNG-${{ github.ref_name }}-' + $rid + '-dbg.zip'
          $updaterOut = Join-Path 'publish' "$rid-updater"
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          dotnet publish Diary.App/Diary.App.csproj --configuration Release --runtime $rid --self-contained true --no-restore --output $out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $workerExecutable = if ($rid -eq 'win-x64') { 'Diary.Script.Worker.exe' } else { 'Diary.Script.Worker' }
          $updaterExecutable = if ($rid -eq 'win-x64') { 'Diary.Updater.exe' } else { 'Diary.Updater' }
          dotnet publish Diary.Updater/Diary.Updater.csproj --configuration Release --runtime $rid --self-contained true --no-restore --output $updaterOut
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $publishedUpdater = Join-Path $updaterOut $updaterExecutable
          if (-not (Test-Path -LiteralPath $publishedUpdater -PathType Leaf)) {
            throw "Updater publish output is missing single-file executable: $updaterExecutable"
          }
          Copy-Item -LiteralPath $publishedUpdater -Destination (Join-Path $out $updaterExecutable) -Force
          if ($rid -eq 'linux-x64') {
            & chmod +x (Join-Path $out $updaterExecutable)
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $updaterVersion = & (Join-Path $out $updaterExecutable) --machine-version | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $updaterVersion.protocolVersion -ne 1 -or $updaterVersion.rid -ne $rid) {
            throw "Unexpected updater identity: $($updaterVersion | ConvertTo-Json -Compress)"
          }
          $nativeRuntimeFiles = if ($rid -eq 'win-x64') {
            @('nng.dll', 'mbedcrypto.dll', 'mbedtls.dll', 'mbedx509.dll')
          } else {
            @('libnng.so', 'libmbedcrypto.so', 'libmbedtls.so', 'libmbedx509.so')
          }
          $requiredFiles = @(
            'Diary.App.dll',
            'Diary.Script.Worker.dll',
            $workerExecutable,
            'Diary.Script.Worker.deps.json',
            'Diary.Script.Worker.runtimeconfig.json',
            $updaterExecutable,
            'Microsoft.Diagnostics.NETCore.Client.dll',
            'Diary.RedMine.dll',
            'Diary.RedMine.UI.dll',
            'Diary.RedMine.SQLite.dll',
            'Diary.RedMine.PostgreSQL.dll',
            'Diary.Jira.dll',
            'Diary.Jira.UI.dll',
            'Diary.Jira.SQLite.dll',
            'Diary.Jira.PostgreSQL.dll',
            'nng.NET.dll',
            'nng.NET.Shared.dll'
          ) + $nativeRuntimeFiles
          foreach ($requiredFile in $requiredFiles) {
            $requiredPath = Join-Path $out $requiredFile
            if (-not (Test-Path -LiteralPath $requiredPath)) {
              throw "Publish output is missing required file: $requiredFile"
            }
          }
          $runtimesDirectory = Join-Path $out 'runtimes'
          $targetRuntimeDirectory = Join-Path $runtimesDirectory $rid
          $anyRuntimeDirectory = Join-Path $runtimesDirectory 'any'
          if (-not (Test-Path -LiteralPath $targetRuntimeDirectory -PathType Container)) {
            throw "Publish output is missing target runtime directory: runtimes/$rid"
          }
          if (-not (Test-Path -LiteralPath $anyRuntimeDirectory -PathType Container)) {
            throw 'Publish output is missing RID-agnostic runtime directory: runtimes/any'
          }
          Get-ChildItem -LiteralPath $runtimesDirectory -Directory -Force |
            Where-Object { $_.Name -ne $rid -and $_.Name -ne 'any' } |
            Remove-Item -Recurse -Force
          $unexpectedRuntimeDirectory = Get-ChildItem -LiteralPath $runtimesDirectory -Directory -Force |
            Where-Object { $_.Name -ne $rid -and $_.Name -ne 'any' } |
            Select-Object -First 1
          if ($null -ne $unexpectedRuntimeDirectory) {
            throw "Failed to remove unrelated runtime directory: $($unexpectedRuntimeDirectory.FullName)"
          }
          $publishRoot = (Resolve-Path -LiteralPath $out).Path
          $pdbFiles = @(Get-ChildItem -LiteralPath $out -Recurse -File -Filter '*.pdb')
          if ($pdbFiles.Count -eq 0) {
            throw 'Publish output does not contain any PDB files'
          }
          foreach ($pdbFile in $pdbFiles) {
            $relativePath = [System.IO.Path]::GetRelativePath($publishRoot, $pdbFile.FullName)
            $debugPath = Join-Path $debugOut $relativePath
            $debugDirectory = Split-Path -Parent $debugPath
            New-Item -ItemType Directory -Path $debugDirectory -Force | Out-Null
            Move-Item -LiteralPath $pdbFile.FullName -Destination $debugPath
          }
          Compress-Archive -Path (Join-Path $debugOut '*') -DestinationPath $debugArchive -CompressionLevel Optimal
          function Assert-DebugArchive([string] $archivePath) {
            $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path -LiteralPath $archivePath))
            try {
              $fileEntries = @($zip.Entries | Where-Object { -not [string]::IsNullOrEmpty($_.Name) })
              if ($fileEntries.Count -eq 0) {
                throw 'Debug archive is empty'
              }
              $unexpectedEntry = $fileEntries | Where-Object {
                -not $_.FullName.EndsWith('.pdb', [System.StringComparison]::OrdinalIgnoreCase)
              } | Select-Object -First 1
              if ($null -ne $unexpectedEntry) {
                throw "Debug archive contains non-PDB entry: $($unexpectedEntry.FullName)"
              }
            } finally {
              $zip.Dispose()
            }
          }
          Assert-DebugArchive $debugArchive
          function Assert-NoPdbEntries([string] $archivePath) {
            $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path -LiteralPath $archivePath))
            try {
              $pdbEntry = $zip.Entries | Where-Object {
                $_.FullName.EndsWith('.pdb', [System.StringComparison]::OrdinalIgnoreCase)
              } | Select-Object -First 1
              if ($null -ne $pdbEntry) {
                throw "Application archive contains PDB entry: $($pdbEntry.FullName)"
              }
            } finally {
              $zip.Dispose()
            }
          }
          function Assert-RuntimeDirectories([string] $archivePath, [string] $targetRid) {
            $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path -LiteralPath $archivePath))
            try {
              $targetPrefix = "runtimes/$targetRid/"
              $targetRuntimeEntry = $zip.Entries | Where-Object {
                $_.FullName.StartsWith($targetPrefix, [System.StringComparison]::OrdinalIgnoreCase)
              } | Select-Object -First 1
              if ($null -eq $targetRuntimeEntry) {
                throw "Archive is missing target runtime directory: runtimes/$targetRid"
              }
              $anyRuntimeEntry = $zip.Entries | Where-Object {
                $_.FullName.StartsWith('runtimes/any/', [System.StringComparison]::OrdinalIgnoreCase)
              } | Select-Object -First 1
              if ($null -eq $anyRuntimeEntry) {
                throw 'Archive is missing RID-agnostic runtime directory: runtimes/any'
              }
              $unexpectedRuntimeEntry = $zip.Entries | Where-Object {
                $_.FullName.StartsWith('runtimes/', [System.StringComparison]::OrdinalIgnoreCase) -and
                $_.FullName -ne 'runtimes/' -and
                -not ($_.FullName.StartsWith($targetPrefix, [System.StringComparison]::OrdinalIgnoreCase)) -and
                -not ($_.FullName.StartsWith('runtimes/any/', [System.StringComparison]::OrdinalIgnoreCase))
              } | Select-Object -First 1
              if ($null -ne $unexpectedRuntimeEntry) {
                throw "Archive contains unrelated runtime entry: $($unexpectedRuntimeEntry.FullName)"
              }
            } finally {
              $zip.Dispose()
            }
          }
          if ($rid -eq 'linux-x64') {
            Push-Location $out
            & zip -r (Join-Path $env:GITHUB_WORKSPACE $archive) .
            $zipExitCode = $LASTEXITCODE
            Pop-Location
            if ($zipExitCode -ne 0) { exit $zipExitCode }
            Assert-RuntimeDirectories $archive $rid
            Assert-NoPdbEntries $archive
            python Tools/validate-release-package.py --archive $archive --rid $rid --flavor standard
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            Compress-Archive -Path (Join-Path $out '*') -DestinationPath $archive -CompressionLevel Optimal
            Assert-RuntimeDirectories $archive $rid
            Assert-NoPdbEntries $archive
            python Tools/validate-release-package.py --archive $archive --rid $rid --flavor standard
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            $pythonVersion = '3.13.15'
            $pythonCacheDirectory = Join-Path $env:GITHUB_WORKSPACE '.cache/python'
            $pythonArchive = Join-Path $pythonCacheDirectory "python-$pythonVersion-embed-amd64.zip"
            $pythonUri = "https://www.python.org/ftp/python/$pythonVersion/python-$pythonVersion-embed-amd64.zip"
            $pythonSha256 = 'd1f04d990aee1253d8569e8e5104e30fa9f5fa830899f14843448872d936a2cf'
            New-Item -ItemType Directory -Path $pythonCacheDirectory -Force | Out-Null
            $actualSha256 = if (Test-Path -LiteralPath $pythonArchive) {
              (Get-FileHash -LiteralPath $pythonArchive -Algorithm SHA256).Hash.ToLowerInvariant()
            } else {
              ''
            }
            if ($actualSha256 -ne $pythonSha256) {
              $downloadArchive = "$pythonArchive.download"
              Invoke-WebRequest -Uri $pythonUri -OutFile $downloadArchive
              $actualSha256 = (Get-FileHash -LiteralPath $downloadArchive -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($actualSha256 -ne $pythonSha256) {
                throw "Python embedded package checksum mismatch: expected $pythonSha256, got $actualSha256"
              }
              Move-Item -LiteralPath $downloadArchive -Destination $pythonArchive -Force
            }
            if ($actualSha256 -ne $pythonSha256) {
              throw "Python embedded package checksum mismatch: expected $pythonSha256, got $actualSha256"
            }

            $pythonDirectory = Join-Path $out 'python'
            Expand-Archive -LiteralPath $pythonArchive -DestinationPath $pythonDirectory -Force
            $bundledPython = Join-Path $pythonDirectory 'python.exe'
            if (-not (Test-Path -LiteralPath $bundledPython)) {
              throw 'Python embedded package is missing python/python.exe'
            }
            $pythonVersionOutput = & $bundledPython --version 2>&1 | Out-String
            if ($LASTEXITCODE -ne 0 -or $pythonVersionOutput -notmatch 'Python 3\.13\.') {
              throw "Unexpected bundled Python version: $pythonVersionOutput"
            }

            $bundledArchive = 'DiaryAppNG-${{ github.ref_name }}-' + $rid + '-python313.zip'
            Compress-Archive -Path (Join-Path $out '*') -DestinationPath $bundledArchive -CompressionLevel Optimal
            Assert-RuntimeDirectories $bundledArchive $rid
            Assert-NoPdbEntries $bundledArchive
            python Tools/validate-release-package.py --archive $bundledArchive --rid $rid --flavor python313
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          Get-Item $archive, $debugArchive | Format-List Name, Length
          if ($rid -eq 'win-x64') {
            Get-Item $bundledArchive | Format-List Name, Length
          }
      - name: Upload artifact for ${{ matrix.rid }}
        uses: actions/upload-artifact@v7
        with:
          name: DiaryAppNG-${{ github.ref_name }}-${{ matrix.rid }}
          path: DiaryAppNG-${{ github.ref_name }}-${{ matrix.rid }}*.zip
          if-no-files-found: error

  create-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
      - name: Extract release notes from CHANGELOG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BASE_VERSION=$(echo "$VERSION" | sed -E 's/-[a-zA-Z][a-zA-Z0-9.]*$//')
          for candidate in "$VERSION" "$BASE_VERSION"; do
            awk -v version="$candidate" '
              $0 ~ "^## " version " " { found=1; print; next }
              found && $0 ~ /^## / { exit }
              found { print }
            ' Docs/CHANGELOG.md > release-body.md
            [ -s release-body.md ] && break
          done
          if [ ! -s release-body.md ]; then
            echo "Automated release created by CI for ${GITHUB_REF_NAME}." > release-body.md
          fi
      - name: Generate release metadata
        env:
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          python3 <<'PY'
          import hashlib
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          tag = os.environ["TAG"]
          repository = os.environ["REPOSITORY"]
          commit = os.environ["COMMIT"]
          version_id = tag[1:] if tag.startswith("v") else tag
          version_match = re.fullmatch(
              r"(?P<data>\d+\.\d+\.\d+)(?P<suffix>-(?:r\d+|alpha\d*|beta\d*|rc\d*|preview\d*))?",
              version_id,
              re.IGNORECASE,
          )
          if version_match is None:
              raise SystemExit(f"Unsupported release tag format: {tag}")

          suffix = version_match.group("suffix") or ""
          sequence_match = re.fullmatch(r"-r(?P<sequence>\d+)", suffix, re.IGNORECASE)
          if sequence_match is not None:
              sequence = int(sequence_match.group("sequence"))
              channel = "stable"
          elif not suffix:
              sequence = int(
                  subprocess.check_output(["git", "rev-list", "--count", "HEAD"], text=True).strip()
              )
              channel = "stable"
          else:
              sequence = int(
                  subprocess.check_output(["git", "rev-list", "--count", "HEAD"], text=True).strip()
              )
              channel = "preview"

          tag_prefix = f"DiaryAppNG-{tag}-"
          package_specs = [
              ("win-x64", "standard", f"{tag_prefix}win-x64.zip"),
              ("win-x64", "python313", f"{tag_prefix}win-x64-python313.zip"),
              ("linux-x64", "standard", f"{tag_prefix}linux-x64.zip"),
          ]
          debug_specs = [
              ("win-x64", f"{tag_prefix}win-x64-dbg.zip"),
              ("linux-x64", f"{tag_prefix}linux-x64-dbg.zip"),
          ]
          artifact_root = Path("artifacts")

          def find_asset(name: str) -> Path:
              matches = [path for path in artifact_root.rglob(name) if path.is_file()]
              if len(matches) != 1:
                  raise SystemExit(
                      f"Expected exactly one downloaded asset named {name}, found {len(matches)}"
                  )
              return matches[0]

          def sha256(path: Path) -> str:
              digest = hashlib.sha256()
              with path.open("rb") as stream:
                  for block in iter(lambda: stream.read(1024 * 1024), b""):
                      digest.update(block)
              return digest.hexdigest()

          assets = []
          for rid, flavor, name in package_specs:
              path = find_asset(name)
              assets.append(
                  {
                      "rid": rid,
                      "flavor": flavor,
                      "kind": "package",
                      "name": name,
                      "size": path.stat().st_size,
                      "sha256": sha256(path),
                  }
              )

          debug_assets = []
          for rid, name in debug_specs:
              find_asset(name)
              debug_assets.append({"rid": rid, "name": name})

          metadata = {
              "schemaVersion": 1,
              "repository": repository,
              "tag": tag,
              "commit": commit,
              "versionId": version_id,
              "sequence": sequence,
              "dataVersion": version_match.group("data"),
              "channel": channel,
              "manifestFormatVersion": 1,
              "minUpdaterVersion": 1,
              "minIncrementalSequence": 0,
              "assets": assets,
              "debugAssets": debug_assets,
          }
          metadata_path = Path(f"{tag_prefix}release-metadata.json")
          metadata_path.write_text(
              json.dumps(metadata, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(metadata_path)
          print(json.dumps(metadata, ensure_ascii=False, indent=2))
          PY
      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release-body.md
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') || contains(github.ref_name, '-preview') }}
          files: |
            artifacts/**/*.zip
            DiaryAppNG-${{ github.ref_name }}-release-metadata.json
