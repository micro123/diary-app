name: DotNet Build and Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  format:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore packages
        run: dotnet restore DiaryApp.sln
      - name: Check formatting
        run: dotnet format DiaryApp.sln --no-restore --verify-no-changes

  build-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Restore packages
        run: dotnet restore DiaryApp.sln
      - name: Release build
        run: dotnet build DiaryApp.sln --no-restore --configuration Release
      - name: Run all tests
        run: dotnet test DiaryApp.sln --configuration Release --no-build --no-restore --verbosity minimal
        env:
          DIARY_REQUIRE_POSTGRES_TESTS: ${{ runner.os == 'Linux' && '1' || '0' }}
          DIARY_REQUIRE_PYTHON_TESTS: '1'
