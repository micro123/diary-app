name: DotNet Build and Test
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore packages
        run: dotnet restore DiaryApp.sln
      - name: Check formatting
        run: dotnet format DiaryApp.sln --no-restore --verify-no-changes
      - name: Release build
        run: dotnet build DiaryApp.sln --no-restore --configuration Release
      - name: Test script host
        continue-on-error: true
        run: dotnet test --project Diary.ScriptTests/Diary.ScriptTests.csproj --configuration Release --no-restore
      - name: Test application
        continue-on-error: true
        run: dotnet test --project Diary.AppTests/Diary.AppTests.csproj --configuration Release --no-restore
      - name: Test utility layer
        continue-on-error: true
        run: dotnet test --project Diary.UtilTests/Diary.UtilTests.csproj --configuration Release --no-restore
