name: DotNet Build and Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  format:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore packages
        run: dotnet restore DiaryApp.sln
      - name: Check formatting
        run: dotnet format DiaryApp.sln --no-restore --verify-no-changes

  build-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Restore packages
        run: dotnet restore DiaryApp.sln -p:Configuration=Release
      - name: Release build
        run: dotnet build DiaryApp.sln --no-restore --configuration Release
      - name: Run all tests
        run: dotnet test --solution DiaryApp.sln --configuration Release --no-build --no-restore --verbosity minimal
        env:
          DIARY_REQUIRE_POSTGRES_TESTS: ${{ runner.os == 'Linux' && '1' || '0' }}
          DIARY_REQUIRE_PYTHON_TESTS: '1'

  user-manual:
    name: Build user manual
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build user manual
        uses: ./.github/actions/build-user-manual
        with:
          output-name: DiaryAppNG-${{ github.sha }}-User-Manual
      - name: Upload user manual
        uses: actions/upload-artifact@v7
        with:
          name: DiaryAppNG-user-manual-${{ github.sha }}
          path: artifacts/user-manual/*
          if-no-files-found: error
          retention-days: 7
