name: Manual Build & Release

on:
  workflow_dispatch:
    inputs:
      version_suffix:
        description: '版本后缀 (如 alpha1, test)'
        required: false
        default: 'manual'

permissions:
  contents: write

jobs:
  verify:
    name: Verify release candidate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Restore packages
        run: dotnet restore DiaryApp.sln -p:Configuration=Release
      - name: Release build
        run: dotnet build DiaryApp.sln --configuration Release --no-restore
      - name: Run all tests
        run: dotnet test --solution DiaryApp.sln --configuration Release --no-build --no-restore --verbosity minimal
        env:
          DIARY_REQUIRE_POSTGRES_TESTS: ${{ runner.os == 'Linux' && '1' || '0' }}
          DIARY_REQUIRE_PYTHON_TESTS: '1'

  build:
    needs: [verify, build-docs]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Generate version string
        id: version
        shell: pwsh
        run: |
          $commitCount = git rev-list --count HEAD
          $shortHash = git rev-parse --short HEAD
          $suffix = '${{ inputs.version_suffix }}'
          $version = "r$commitCount-$shortHash-$suffix"
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Download user manual for package
        uses: actions/download-artifact@v7
        with:
          name: DiaryAppNG-${{ steps.version.outputs.version }}-user-manual
          path: artifacts/user-manual
      - name: Restore solution for ${{ matrix.rid }}
        run: dotnet restore DiaryApp.sln --runtime ${{ matrix.rid }} -p:Configuration=Release
      - name: Publish ${{ matrix.rid }}
        shell: pwsh
        run: |
          $rid = '${{ matrix.rid }}'
          $out = Join-Path 'publish' $rid
          $archive = 'DiaryAppNG-${{ steps.version.outputs.version }}-' + $rid + '.zip'
          $debugOut = Join-Path 'publish' "$rid-dbg"
          $debugArchive = 'DiaryAppNG-${{ steps.version.outputs.version }}-' + $rid + '-dbg.zip'
          $updaterOut = Join-Path 'publish' "$rid-updater"
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          dotnet publish Diary.App/Diary.App.csproj --configuration Release --runtime $rid --self-contained true --no-restore --output $out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $manualSourceDirectory = Join-Path $env:GITHUB_WORKSPACE 'artifacts/user-manual/package/Docs/UserManual'
          $manualDestinationDirectory = Join-Path $out 'Docs/UserManual'
          if (-not (Test-Path -LiteralPath $manualSourceDirectory -PathType Container)) {
            throw "User manual package directory is missing: $manualSourceDirectory"
          }
          New-Item -ItemType Directory -Path $manualDestinationDirectory -Force | Out-Null
          Copy-Item -LiteralPath (Join-Path $manualSourceDirectory 'DiaryApp-User-Manual.html') -Destination $manualDestinationDirectory -Force
          Copy-Item -LiteralPath (Join-Path $manualSourceDirectory 'DiaryApp-User-Manual.pdf') -Destination $manualDestinationDirectory -Force
          $workerExecutable = if ($rid -eq 'win-x64') { 'Diary.Script.Worker.exe' } else { 'Diary.Script.Worker' }
          $updaterExecutable = if ($rid -eq 'win-x64') { 'Diary.Updater.exe' } else { 'Diary.Updater' }
          dotnet publish Diary.Updater/Diary.Updater.csproj --configuration Release --runtime $rid --self-contained true --no-restore --output $updaterOut
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $publishedUpdater = Join-Path $updaterOut $updaterExecutable
          if (-not (Test-Path -LiteralPath $publishedUpdater -PathType Leaf)) {
            throw "Updater publish output is missing single-file executable: $updaterExecutable"
          }
          Copy-Item -LiteralPath $publishedUpdater -Destination (Join-Path $out $updaterExecutable) -Force
          if ($rid -eq 'linux-x64') {
            & chmod +x (Join-Path $out $updaterExecutable)
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $updaterVersion = & (Join-Path $out $updaterExecutable) --machine-version | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $updaterVersion.protocolVersion -ne 1 -or $updaterVersion.rid -ne $rid) {
            throw "Unexpected updater identity: $($updaterVersion | ConvertTo-Json -Compress)"
          }
          $nativeRuntimeFiles = if ($rid -eq 'win-x64') {
            @('nng.dll', 'mbedcrypto.dll', 'mbedtls.dll', 'mbedx509.dll')
          } else {
            @('libnng.so', 'libmbedcrypto.so', 'libmbedtls.so', 'libmbedx509.so')
          }
          $requiredFiles = @(
            'Diary.App.dll',
            'Diary.Script.Worker.dll',
            $workerExecutable,
            'Diary.Script.Worker.deps.json',
            'Diary.Script.Worker.runtimeconfig.json',
            $updaterExecutable,
            $(if ($rid -eq 'win-x64') { 'Diary.Mcp.exe' } else { 'Diary.Mcp' }),
            'Diary.Mcp.dll',
            'Diary.Mcp.deps.json',
            'Diary.Mcp.runtimeconfig.json',
            'Microsoft.Diagnostics.NETCore.Client.dll',
            'Diary.RedMine.dll',
            'Diary.RedMine.UI.dll',
            'Diary.RedMine.SQLite.dll',
            'Diary.RedMine.PostgreSQL.dll',
            'Diary.Jira.dll',
            'Diary.Jira.UI.dll',
            'Diary.Jira.SQLite.dll',
            'Diary.Jira.PostgreSQL.dll',
            'nng.NET.dll',
            'nng.NET.Shared.dll',
            'Docs/UserManual/DiaryApp-User-Manual.html',
            'Docs/UserManual/DiaryApp-User-Manual.pdf'
          ) + $nativeRuntimeFiles
          foreach ($requiredFile in $requiredFiles) {
            $requiredPath = Join-Path $out $requiredFile
            if (-not (Test-Path -LiteralPath $requiredPath)) {
              throw "Publish output is missing required file: $requiredFile"
            }
          }
          $runtimesDirectory = Join-Path $out 'runtimes'
          $targetRuntimeDirectory = Join-Path $runtimesDirectory $rid
          $anyRuntimeDirectory = Join-Path $runtimesDirectory 'any'
          if (-not (Test-Path -LiteralPath $targetRuntimeDirectory -PathType Container)) {
            throw "Publish output is missing target runtime directory: runtimes/$rid"
          }
          if (-not (Test-Path -LiteralPath $anyRuntimeDirectory -PathType Container)) {
            throw 'Publish output is missing RID-agnostic runtime directory: runtimes/any'
          }
          Get-ChildItem -LiteralPath $runtimesDirectory -Directory -Force |
            Where-Object { $_.Name -ne $rid -and $_.Name -ne 'any' } |
            Remove-Item -Recurse -Force
          $unexpectedRuntimeDirectory = Get-ChildItem -LiteralPath $runtimesDirectory -Directory -Force |
            Where-Object { $_.Name -ne $rid -and $_.Name -ne 'any' } |
            Select-Object -First 1
          if ($null -ne $unexpectedRuntimeDirectory) {
            throw "Failed to remove unrelated runtime directory: $($unexpectedRuntimeDirectory.FullName)"
          }
          $publishRoot = (Resolve-Path -LiteralPath $out).Path
          $pdbFiles = @(Get-ChildItem -LiteralPath $out -Recurse -File -Filter '*.pdb')
          if ($pdbFiles.Count -eq 0) {
            throw 'Publish output does not contain any PDB files'
          }
          foreach ($pdbFile in $pdbFiles) {
            $relativePath = [System.IO.Path]::GetRelativePath($publishRoot, $pdbFile.FullName)
            $debugPath = Join-Path $debugOut $relativePath
            $debugDirectory = Split-Path -Parent $debugPath
            New-Item -ItemType Directory -Path $debugDirectory -Force | Out-Null
            Move-Item -LiteralPath $pdbFile.FullName -Destination $debugPath
          }
          Compress-Archive -Path (Join-Path $debugOut '*') -DestinationPath $debugArchive -CompressionLevel Optimal
          function Assert-DebugArchive([string] $archivePath) {
            $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path -LiteralPath $archivePath))
            try {
              $fileEntries = @($zip.Entries | Where-Object { -not [string]::IsNullOrEmpty($_.Name) })
              if ($fileEntries.Count -eq 0) {
                throw 'Debug archive is empty'
              }
              $unexpectedEntry = $fileEntries | Where-Object {
                -not $_.FullName.EndsWith('.pdb', [System.StringComparison]::OrdinalIgnoreCase)
              } | Select-Object -First 1
              if ($null -ne $unexpectedEntry) {
                throw "Debug archive contains non-PDB entry: $($unexpectedEntry.FullName)"
              }
            } finally {
              $zip.Dispose()
            }
          }
          Assert-DebugArchive $debugArchive
          function Assert-NoPdbEntries([string] $archivePath) {
            $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path -LiteralPath $archivePath))
            try {
              $pdbEntry = $zip.Entries | Where-Object {
                $_.FullName.EndsWith('.pdb', [System.StringComparison]::OrdinalIgnoreCase)
              } | Select-Object -First 1
              if ($null -ne $pdbEntry) {
                throw "Application archive contains PDB entry: $($pdbEntry.FullName)"
              }
            } finally {
              $zip.Dispose()
            }
          }
          function Assert-RuntimeDirectories([string] $archivePath, [string] $targetRid) {
            $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path -LiteralPath $archivePath))
            try {
              $targetPrefix = "runtimes/$targetRid/"
              $targetRuntimeEntry = $zip.Entries | Where-Object {
                $_.FullName.StartsWith($targetPrefix, [System.StringComparison]::OrdinalIgnoreCase)
              } | Select-Object -First 1
              if ($null -eq $targetRuntimeEntry) {
                throw "Archive is missing target runtime directory: runtimes/$targetRid"
              }
              $anyRuntimeEntry = $zip.Entries | Where-Object {
                $_.FullName.StartsWith('runtimes/any/', [System.StringComparison]::OrdinalIgnoreCase)
              } | Select-Object -First 1
              if ($null -eq $anyRuntimeEntry) {
                throw 'Archive is missing RID-agnostic runtime directory: runtimes/any'
              }
              $unexpectedRuntimeEntry = $zip.Entries | Where-Object {
                $_.FullName.StartsWith('runtimes/', [System.StringComparison]::OrdinalIgnoreCase) -and
                $_.FullName -ne 'runtimes/' -and
                -not ($_.FullName.StartsWith($targetPrefix, [System.StringComparison]::OrdinalIgnoreCase)) -and
                -not ($_.FullName.StartsWith('runtimes/any/', [System.StringComparison]::OrdinalIgnoreCase))
              } | Select-Object -First 1
              if ($null -ne $unexpectedRuntimeEntry) {
                throw "Archive contains unrelated runtime entry: $($unexpectedRuntimeEntry.FullName)"
              }
            } finally {
              $zip.Dispose()
            }
          }
          if ($rid -eq 'linux-x64') {
            Push-Location $out
            & zip -r (Join-Path $env:GITHUB_WORKSPACE $archive) .
            $zipExitCode = $LASTEXITCODE
            Pop-Location
            if ($zipExitCode -ne 0) { exit $zipExitCode }
            Assert-RuntimeDirectories $archive $rid
            Assert-NoPdbEntries $archive
            python Tools/validate-release-package.py --archive $archive --rid $rid --flavor standard --require-user-manual
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            Compress-Archive -Path (Join-Path $out '*') -DestinationPath $archive -CompressionLevel Optimal
            Assert-RuntimeDirectories $archive $rid
            Assert-NoPdbEntries $archive
            python Tools/validate-release-package.py --archive $archive --rid $rid --flavor standard --require-user-manual
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          Get-Item $archive, $debugArchive | Format-List Name, Length
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: DiaryAppNG-${{ steps.version.outputs.version }}-${{ matrix.rid }}
          path: DiaryAppNG-${{ steps.version.outputs.version }}-${{ matrix.rid }}*.zip
          if-no-files-found: error

  build-docs:
    name: Build user manual
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Generate version string
        id: version
        shell: pwsh
        run: |
          $commitCount = git rev-list --count HEAD
          $shortHash = git rev-parse --short HEAD
          $suffix = '${{ inputs.version_suffix }}'
          $version = "r$commitCount-$shortHash-$suffix"
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Build user manual
        uses: ./.github/actions/build-user-manual
        with:
          output-name: DiaryAppNG-${{ steps.version.outputs.version }}-User-Manual
      - name: Upload user manual
        uses: actions/upload-artifact@v7
        with:
          name: DiaryAppNG-${{ steps.version.outputs.version }}-user-manual
          path: artifacts/user-manual
          if-no-files-found: error

  create-release:
    needs: [build, build-docs]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Generate version string
        id: version
        shell: pwsh
        run: |
          $commitCount = git rev-list --count HEAD
          $shortHash = git rev-parse --short HEAD
          $suffix = '${{ inputs.version_suffix }}'
          $version = "r$commitCount-$shortHash-$suffix"
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: DiaryAppNG-*
          merge-multiple: true
          path: artifacts
      - name: Delete old manual releases
        run: |
          gh release list --limit 50 --json tagName,name \
            --jq '.[] | select(.name | startswith("Manual Build")) | .tagName' |
          while read tag; do
            echo "Deleting old manual release: $tag"
            gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
          done
        env:
          GH_TOKEN: ${{ github.token }}
        continue-on-error: true
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          name: Manual Build ${{ steps.version.outputs.version }}
          tag_name: manual-${{ steps.version.outputs.version }}
          prerelease: true
          files: |
            artifacts/*.zip
            artifacts/DiaryAppNG-${{ steps.version.outputs.version }}-User-Manual.pdf
            artifacts/DiaryAppNG-${{ steps.version.outputs.version }}-User-Manual.html
          body: |
            ## Manual Build ${{ steps.version.outputs.version }}

            - **Commit**: ${{ github.sha }}
            - **Branch**: ${{ github.ref_name }}
            - **Triggered by**: ${{ github.actor }}

            用户手册 PDF/HTML 已作为 Release 附件生成。
            > 临时手动构建，仅供测试使用。
